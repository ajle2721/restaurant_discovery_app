<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>帶小孩吃什麼？台北親子友善餐廳搜尋</title>

    <meta property="og:type" content="website">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P3JG1JNNEK"></script>

  gtag('js', new Date());

  gtag('config', 'G-P3JG1JNNEK');
</script>
</head>

<body>
    <div id="home-view" class="view active">
        <header class="main-header">
            <h1 class="main-title">帶小孩吃什麼？</h1>
            <p class="subtitle">輸入地點，尋找台北適合帶小孩的餐廳</p>
            
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="location-search" placeholder="輸入捷運站、地標或行政區" autocomplete="off">
                    <button id="clear-search" class="clear-search hidden">&times;</button>
                </div>
                <div id="search-autocomplete" class="autocomplete-dropdown hidden"></div>
            </div>

            <div class="entry-actions">
                <button id="btn-nearby" class="btn btn-nearby">
                    <span class="icon">📍</span> <span class="btn-text-desktop">看我附近適合帶小孩的餐廳</span><span class="btn-text-mobile">找我附近適合小孩的餐廳</span>
                </button>
            </div>

            <div class="quick-links">
                <span class="quick-links-label">熱門地點：</span>
                <div class="quick-links-scroll">
                    <button class="quick-link-item" data-loc="大安區">大安區</button>
                    <button class="quick-link-item" data-loc="信義區">信義區</button>
                    <button class="quick-link-item" data-loc="台北車站">台北車站</button>
                    <button class="quick-link-item" data-loc="西門町">西門町</button>
                    <button class="quick-link-item" data-loc="中山站">中山站</button>
                </div>
            </div>
        </header>



        <section class="trending-section">
            <h2 class="section-title">最近大家在找</h2>
            <div class="trending-grid">
                <button class="trending-item" data-loc="大安區">👨‍👩‍👧‍👦 帶小孩在大安區輕鬆吃飯</button>
                <button class="trending-item" data-loc="台北車站" data-filter="spacious_seating">🚉 帶小孩在台北車站找個可以休息的地方</button>
                <button class="trending-item" data-loc="西門町" data-filter="kid_noise_tolerant">😌 在西門町帶小孩也不用一直提醒小聲</button>
                <button class="trending-item" data-loc="中山站" data-filter="high_chair_available">🪑 在中山站找有兒童椅的餐廳</button>
            </div>
        </section>

        <!-- Search Results View (Hidden until searched) -->
        <div id="search-results-view" class="hidden">
            <div id="search-status-bar" class="search-status-bar">
                <div class="status-content">
                    <span id="current-search-location">顯示全部</span>
                    <button id="reset-search" class="btn-text">重新搜尋</button>
                </div>
            </div>

            <!-- Map Container -->
            <div id="map-container" class="map-view">
                <div id="map"></div>
                <div class="map-overlay-controls">
                    <label class="map-toggle">
                        <input type="checkbox" id="hide-others-markers" checked>
                        <span class="toggle-text">僅顯示推薦餐廳</span>
                    </label>
                </div>
            </div>

            <!-- Filters & List Wrapper -->
            <div class="results-content-wrapper">
                <!-- Filters Section -->
                <div class="filter-section">
                    <div class="filter-header">
                        <span class="filter-title">篩選條件</span>
                        <button id="clear-all-filters" class="btn-text hidden">清除篩選</button>
                    </div>
                    <div class="filters-scroll">
                        <button class="filter-chip" data-filter="high_chair_available">🪑 兒童椅</button>
                        <button class="filter-chip" data-filter="spacious_seating">🛋️ 空間寬敞</button>
                        <button class="filter-chip" data-filter="kid_noise_tolerant">🥳 不怕吵</button>
                        <button class="filter-chip" data-filter="kids_menu">🥘 兒童餐</button>
                    </div>
                </div>

                <main id="restaurant-list" class="results-container">
                    <!-- Recommended Section -->
                    <div id="recommended-section" class="results-section">
                        <div class="section-header">值得推薦 (適合 / 可考慮)</div>
                        <div id="recommended-list"></div>
                    </div>

                    <!-- Fallback Section (Hidden until needed) -->
                    <div id="fallback-hint" class="fallback-hint hidden"></div>

                    <!-- Others Section (Collapsible) -->
                    <div id="others-section" class="results-section">
                        <button id="toggle-others" class="toggle-others-btn">
                            <span>查看更多 (含資訊不足或需留意)</span>
                            <span class="arrow">▼</span>
                        </button>
                        <div id="others-list" class="collapsible-content hidden"></div>
                    </div>

                    <!-- No Results State -->
                    <div id="no-results" class="empty-state hidden">
                        <span class="empty-icon">🔍</span>
                        <h3 id="no-results-title">找不到了</h3>
                        <p id="no-results-desc">試試搜尋其他地點或減少條件</p>
                        <div id="no-results-suggestions" class="suggestion-chips"></div>
                    </div>
                </main>
            </div>
        </div>

        <button id="float-share" class="fab hidden">
            <span>🔗</span>
        </button>
    </div>

    <div id="detail-view" class="view">
        <nav class="detail-header">
            <button class="back-btn" id="back-home">←</button>
            <div style="font-weight: 700; color: var(--text-muted);">餐廳詳情</div>
            <button class="back-btn" id="share-detail">🔗</button>
        </nav>
        <div id="detail-content" class="detail-content">
            <!-- Detail content will be injected here -->
        </div>
    </div>

    <div id="toast" class="toast">連結已複製到剪貼簿！</div>


    <!-- Data and App Logic -->
    <script src="locations.js"></script>
    <script src="ai_review/index.js"></script>
    <script src="app.js"></script>
</body>

</html>
